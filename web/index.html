<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexiRide - Car & Bike Rental</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #1e40af 100%);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }
    
    #root {
      width: 100%;
      max-width: 480px;
      min-height: calc(100vh - 40px);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
    }
    
    /* Hide scrollbar but allow scrolling */
    #root::-webkit-scrollbar {
      width: 0;
      display: none;
    }
    
    /* Phone frame effect */
    #root::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      z-index: 1000;
    }
    
    /* Mobile view - full width */
    @media (max-width: 520px) {
      body {
        padding: 0;
        background: #ffffff;
      }
      
      #root {
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
      
      #root::before {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
